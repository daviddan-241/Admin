services:
  - type: web
    name: hannah-brooks
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install && VITE_ADMIN_ONLY=true BASE_PATH=/ pnpm --filter @workspace/hannah-brooks run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hannah-brooks-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: hannah-brooks-db
    plan: free
    region: oregon
